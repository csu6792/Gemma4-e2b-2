<html lang="zh-Hant">

<style>
:root{

*{

}

html,body{

  min-height:100%;

}

body{

button,textarea{

}

<body>

<div class="app">

<header>

<h1>Gemma 4 E2B</h1>

<div class="subtitle">
QAT Mobile · WebGPU · iPhone Safari · V15
</div>

<div id="status" class="status">
正在檢查 WebGPU…
</div>

<div id="progressWrap" class="progress-wrap">
<div id="progress" class="progress"></div>
</div>

<div class="buttons">

<button
id="loadBtn"
class="primary"
type="button">
載入 Gemma 4
</button>

id="diagBtn"
type="button">
GPU 診斷
</button>

<button
id="clearBtn"
type="button"
disabled>
清除
</button>

</div>

<div
id="memoryWarning"
class="memory-warning">
iPhone 低記憶體模式：不會預先把模型 fetch 成 Blob，
不會自行建立大型 ArrayBuffer，不會自動重新初始化。
</div>

id="diagnostic"
class="diagnostic">診斷資訊初始化中…</pre>

<main id="messages">

<div id="empty" class="empty">

<div class="empty-title">
Gemma 4 E2B
</div>

<div class="empty-text">
完全在瀏覽器使用 WebGPU 執行。<br>
按「載入 Gemma 4」開始。
</div>

</div>

</main>

</div>


<div class="composer">

<div class="composer-inner">

<textarea
id="input"
rows="1"
placeholder="模型載入後輸入訊息…"
disabled
autocomplete="off"
autocorrect="on"
autocapitalize="sentences"
spellcheck="true"></textarea>

<button
id="sendBtn"
class="primary"
type="button"
disabled>
發送
</button>

</div>

</div>


<script type="module">

/*
============================================================
Gemma 4 E2B
iPhone Safari V15

請把官方：

gemma-4-e2b.js

與本 index.html 放在同一個 GitHub Pages 目錄。

本檔案不下載模型本身。
模型下載與 WebGPU 初始化交給官方 Gemma4Mobile。

============================================================
*/

import {
  Gemma4Mobile
} from "./gemma-4-e2b.js";


const $ = id =>
  document.getElementById(id);


const statusEl =
  $("status");

const progressWrap =
  $("progressWrap");

const progressEl =
  $("progress");

const loadBtn =
  $("loadBtn");

const diagBtn =
  $("diagBtn");

const clearBtn =
  $("clearBtn");

const inputEl =
  $("input");

const sendBtn =
  $("sendBtn");

const messagesEl =
  $("messages");

const diagnosticEl =
  $("diagnostic");

const memoryWarningEl =
  $("memoryWarning");


let model = null;

let loading = false;

let generating = false;

let loadStartedAt = 0;

let lastProgress = 0;


/*
============================================================
Status
============================================================
*/

function setStatus(type,text){

  statusEl.className = "status";

  if(type){
    statusEl.classList.add(type);
  }

  statusEl.textContent = text;
}


/*
============================================================
GPU diagnostics
============================================================
*/

async function runDiagnostics(){

  const lines = [];

  lines.push(
    "Gemma 4 E2B V15"
  );

  lines.push(
    "=============================="
  );

  lines.push(
    "WebGPU: " +
    (
      navigator.gpu
        ? "✓"
        : "✗"
    )
  );

  lines.push(
    "Platform: " +
    (
      navigator.platform ||
      "unknown"
    )
  );

  lines.push(
    "Device memory: " +
    (
      navigator.deviceMemory
        ? navigator.deviceMemory + " GB"
        : "unavailable"
    )
  );

  lines.push(
    "CPU threads: " +
    (
      navigator.hardwareConcurrency ||
      "unknown"
    )
  );

  lines.push(
    "Visibility: " +
    (
      document.hidden
        ? "BACKGROUND"
        : "FOREGROUND"
    )
  );

  lines.push(
    "Model: " +
    (
      model
        ? "READY"
        : loading
          ? "LOADING"
          : "NOT LOADED"
    )
  );


  /*
  ----------------------------------------------------------
  WebGPU adapter test
  ----------------------------------------------------------
  */

  if(navigator.gpu){

    try{

      const adapter =
        await navigator.gpu.requestAdapter();

      if(!adapter){

        lines.push(
          "Adapter: ✗ 無法取得"
        );

      }else{

        lines.push(
          "Adapter: ✓"
        );


        try{

          if(
            typeof adapter.info ===
            "object"
          ){

            const info =
              adapter.info;

            if(info){

              if(info.vendor){
                lines.push(
                  "Vendor: " +
                  info.vendor
                );
              }

              if(info.architecture){
                lines.push(
                  "Architecture: " +
                  info.architecture
                );
              }

              if(info.device){
                lines.push(
                  "Device: " +
                  info.device
                );
              }

              if(info.description){
                lines.push(
                  "Description: " +
                  info.description
                );
              }

            }

          }

        }catch(e){}


        try{

          const limits =
            adapter.limits;

          if(limits){

            lines.push(
              "maxBufferSize: " +
              formatBytes(
                Number(
                  limits.maxBufferSize
                )
              )
            );

            lines.push(
              "maxStorageBufferBindingSize: " +
              formatBytes(
                Number(
                  limits.maxStorageBufferBindingSize
                )
              )
            );

            lines.push(
              "maxTextureDimension2D: " +
              String(
                limits.maxTextureDimension2D
              )
            );

          }

        }catch(e){}


        try{

          const features =
            [...adapter.features];

          lines.push(
            "Features: " +
            (
              features.length
                ? features.join(", ")
                : "none"
            )
          );

        }catch(e){}

      }

    }catch(error){

      lines.push(
        "Adapter error: " +
        (
          error?.message ||
          String(error)
        )
      );

    }

  }


  lines.push(
    "=============================="
  );

  lines.push(
    "Result: " +
    (
      navigator.gpu
        ? "✓ 基本 WebGPU 檢查完成"
        : "✗ 不支援 WebGPU"
    )
  );


  diagnosticEl.textContent =
    lines.join("\n");
}


function formatBytes(bytes){

  if(
    !Number.isFinite(bytes) ||
    bytes <= 0
  ){
    return "unknown";
  }

  const gb =
    bytes /
    1024 /
    1024 /
    1024;

  if(gb >= 1){
    return gb.toFixed(2) + " GB";
  }

  const mb =
    bytes /
    1024 /
    1024;

  return mb.toFixed(0) + " MB";
}


/*
============================================================
General diagnostics
============================================================
*/

function updateDiagnostic(extra=""){

  const lines = [];

  lines.push(
    "WebGPU: " +
    (
      navigator.gpu
        ? "✓"
        : "✗"
    )
  );

  lines.push(
    "Device memory: " +
    (
      navigator.deviceMemory
        ? navigator.deviceMemory + " GB"
        : "unavailable"
    )
  );

  lines.push(
    "CPU threads: " +
    (
      navigator.hardwareConcurrency ||
      "unknown"
    )
  );

  lines.push(
    "Page visibility: " +
    (
      document.hidden
        ? "BACKGROUND"
        : "FOREGROUND"
    )
  );

  lines.push(
    "Model: " +
    (
      model
        ? "READY"
        : loading
          ? "LOADING"
          : "NOT LOADED"
    )
  );

  if(loadStartedAt){

    const elapsed =
      (
        performance.now() -
        loadStartedAt
      ) / 1000;

    lines.push(
      "Elapsed: " +
      elapsed.toFixed(1) +
      " s"
    );
  }

  lines.push(
    "Progress: " +
    Math.round(
      lastProgress * 100
    ) +
    "%"
  );

  if(extra){
    lines.push(extra);
  }

  diagnosticEl.textContent =
    lines.join("\n");
}


/*
============================================================
Progress callback
============================================================
*/

function updateProgress(info){

  let progress = null;

  let message = "";


  if(
    typeof info ===
    "number"
  ){

    progress = info;

  }else if(
    info &&
    typeof info ===
    "object"
  ){

    if(
      typeof info.progress ===
      "number"
    ){

      progress =
        info.progress;
    }


    if(
      typeof info.percent ===
      "number"
    ){

      progress =
        info.percent / 100;
    }


    if(
      typeof info.loaded ===
      "number" &&
      typeof info.total ===
      "number" &&
      info.total > 0
    ){

      progress =
        info.loaded /
        info.total;
    }


    if(
      typeof info.message ===
      "string"
    ){

      message =
        info.message;
    }


    if(
      typeof info.status ===
      "string"
    ){

      message =
        info.status;
    }

  }


  if(
    progress !== null &&
    Number.isFinite(progress)
  ){

    if(progress > 1){
      progress /= 100;
    }


    progress =
      Math.max(
        0,
        Math.min(
          1,
          progress
        )
      );


    if(
      progress >=
      lastProgress
    ){

      lastProgress =
        progress;

      progressEl.style.width =
        Math.round(
          progress * 100
        ) + "%";
    }

  }


  if(message){

    setStatus(
      "loading",
      message
    );

  }else{

    setStatus(
      "loading",
      "載入中 " +
      Math.round(
        lastProgress * 100
      ) +
      "%"
    );
  }


  updateDiagnostic();
}


/*
============================================================
Conservative fetch wrapper

注意：

這裡不會自己下載整個模型。

Gemma4Mobile 仍然控制真正的模型 loading。

這個 wrapper 只處理暫時性網路錯誤。
============================================================
*/

async function fetchWithRetry(
  input,
  init
){

  const maxRetries = 2;

  let lastError = null;


  for(
    let attempt = 0;
    attempt <= maxRetries;
    attempt++
  ){

    if(document.hidden){

      throw new Error(
        "Safari 已進入背景，停止網路重試。"
      );
    }


    try{

      const response =
        await fetch(
          input,
          init
        );


      /*
      4xx 不重試。
      例如 HF 401 / 403。
      */

      if(
        response.status >= 400 &&
        response.status < 500
      ){

        return response;
      }


      if(!response.ok){

        throw new Error(
          "HTTP " +
          response.status
        );
      }


      return response;

    }catch(error){

      lastError =
        error;


      if(
        error?.name ===
        "AbortError"
      ){

        throw error;
      }


      if(document.hidden){

        throw error;
      }


      if(
        attempt >=
        maxRetries
      ){

        throw error;
      }


      const wait =
        1000 *
        Math.pow(
          2,
          attempt
        );


      setStatus(
        "warning",
        "網路暫時中斷，" +
        Math.ceil(
          wait / 1000
        ) +
        " 秒後重試…"
      );


      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            wait
          )
      );
    }
  }


  throw(
    lastError ||
    new Error(
      "網路載入失敗"
    )
  );
}


/*
============================================================
UI state
============================================================
*/

function updateUI(){

  loadBtn.disabled =
    loading ||
    !!model;

  clearBtn.disabled =
    !model ||
    loading ||
    generating;

  inputEl.disabled =
    !model ||
    loading ||
    generating;

  sendBtn.disabled =
    !model ||
    loading ||
    generating ||
    !inputEl.value.trim();
}


/*
============================================================
Message
============================================================
*/

function addMessage(
  role,
  text
){

  const empty =
    document.getElementById(
      "empty"
    );

  if(empty){
    empty.remove();
  }


  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message " +
    role;


  const roleEl =
    document.createElement(
      "div"
    );

  roleEl.className =
    "role";

  roleEl.textContent =
    role === "user"
      ? "YOU"
      : "GEMMA 4";


  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";

  bubble.textContent =
    text || "";


  message.appendChild(
    roleEl
  );

  message.appendChild(
    bubble
  );

  messagesEl.appendChild(
    message
  );


  messagesEl.scrollTop =
    messagesEl.scrollHeight;


  return bubble;
}


/*
============================================================
LOAD MODEL
============================================================
*/

async function loadModel(){

  if(
    loading ||
    model
  ){
    return;
  }


  if(!navigator.gpu){

    setStatus(
      "error",
      "此 Safari 不支援 WebGPU"
    );

    return;
  }


  loading = true;

  loadStartedAt =
    performance.now();

  lastProgress = 0;


  updateUI();


  progressWrap.style.display =
    "block";

  progressEl.style.width =
    "0%";


  memoryWarningEl.style.display =
    "block";


  setStatus(
    "loading",
    "正在啟動官方 Gemma4Mobile…"
  );


  updateDiagnostic(
    "Stage: Gemma4Mobile.load()"
  );


  try{

    /*
    --------------------------------------------------------
    官方 Gemma4Mobile loader

    不自己 requestAdapter。
    不自己 requestDevice。
    不 fetch 完整模型。
    不建立 Blob。
    --------------------------------------------------------
    */


    model =
      await Gemma4Mobile.load(
        null,
        {
          onProgress:
            updateProgress,

          fetch:
            fetchWithRetry,

          runtimeOptions: {

            disabledFeatures: [
              "subgroups",
              "chromium-experimental-subgroup-matrix"
            ]

          }

        }
      );


    /*
    --------------------------------------------------------
    MODEL LOADED
    --------------------------------------------------------
    */

    updateDiagnostic(
      "Stage: MODEL LOADED"
    );


    setStatus(
      "loading",
      "模型已載入，準備 WebGPU warmup…"
    );


    /*
    --------------------------------------------------------
    Warmup

    只執行一次。
    不自動 retry。
    --------------------------------------------------------
    */

    if(
      typeof model.warmup ===
      "function"
    ){

      await model.warmup();

    }


    progressEl.style.width =
      "100%";


    setStatus(
      "success",
      "✓ Gemma 4 E2B 已準備完成"
    );


    updateDiagnostic(
      "Stage: READY"
    );


    inputEl.disabled =
      false;

    clearBtn.disabled =
      false;

    inputEl.focus();


  }catch(error){

    console.error(
      "Gemma4Mobile error:",
      error
    );


    model = null;


    const message =
      error?.message ||
      String(error);


    setStatus(
      "error",
      "載入失敗：" +
      message
    );


    updateDiagnostic(
      "Stage: ERROR\n" +
      message
    );

  }finally{

    loading = false;


    progressWrap.style.display =
      "none";


    updateUI();
  }
}


/*
============================================================
GENERATE
============================================================
*/

async function sendMessage(){

  if(
    !model ||
    loading ||
    generating
  ){
    return;
  }


  const prompt =
    inputEl.value.trim();


  if(!prompt){
    return;
  }


  generating = true;

  updateUI();


  inputEl.value = "";

  inputEl.style.height =
    "auto";


  addMessage(
    "user",
    prompt
  );


  const output =
    addMessage(
      "assistant",
      ""
    );


  setStatus(
    "loading",
    "Gemma 4 生成中…"
  );


  try{

    /*
    --------------------------------------------------------
    Try official generate API.
    --------------------------------------------------------
    */

    let result;


    if(
      typeof model.generate ===
      "function"
    ){

      result =
        model.generate(
          [
            {
              role:"user",
              content:prompt
            }
          ],
          {
            maxNewTokens:256,
            temperature:.7,
            topP:.9
          }
        );

    }else if(
      typeof model.generateResponse ===
      "function"
    ){

      /*
      相容部分舊版 runtime。
      */

      await new Promise(
        (resolve,reject)=>{

          let finished = false;

          let fullText = "";


          try{

            const r =
              model.generateResponse(
                prompt,
                (
                  partial,
                  done
                )=>{

                  if(
                    typeof partial ===
                    "string"
                  ){

                    fullText +=
                      partial;

                  }else if(
                    partial &&
                    typeof partial.text ===
                    "string"
                  ){

                    fullText +=
                      partial.text;
                  }


                  output.textContent =
                    fullText ||
                    "…";


                  messagesEl.scrollTop =
                    messagesEl.scrollHeight;


                  if(
                    done &&
                    !finished
                  ){

                    finished = true;

                    resolve();
                  }

                }
              );


            if(
              r &&
              typeof r.then ===
              "function"
            ){

              r.then(
                ()=>{
                  if(
                    !finished
                  ){

                    finished = true;

                    resolve();
                  }
                },
                reject
              );
            }

          }catch(error){

            reject(error);
          }

        }
      );


      setStatus(
        "success",
        "生成完成"
      );

      generating = false;

      updateUI();

      inputEl.focus();

      return;

    }else{

      throw new Error(
        "目前官方 JS 沒有可用的 generate API。"
      );
    }


    /*
    --------------------------------------------------------
    Handle async iterator
    --------------------------------------------------------
    */

    if(
      result &&
      typeof result[
        Symbol.asyncIterator
      ] ===
      "function"
    ){

      let fullText = "";


      for await(
        const chunk of result
      ){

        if(
          chunk &&
          typeof chunk.text ===
          "string"
        ){

          /*
          Some runtimes provide
          cumulative text.
          */

          fullText =
            chunk.text;

        }else if(
          typeof chunk ===
          "string"
        ){

          fullText +=
            chunk;
        }


        output.textContent =
          fullText ||
          "…";


        messagesEl.scrollTop =
          messagesEl.scrollHeight;
      }


    }else{

      const value =
        await result;


      if(
        typeof value ===
        "string"
      ){

        output.textContent =
          value;

      }else if(
        value &&
        typeof value.text ===
        "string"
      ){

        output.textContent =
          value.text;

      }else{

        output.textContent =
          String(
            value ??
            ""
          );
      }
    }


    if(
      !output.textContent
    ){

      output.textContent =
        "(無回應)";
    }


    setStatus(
      "success",
      "生成完成"
    );


  }catch(error){

    console.error(
      "Generation error:",
      error
    );


    output.textContent =
      "[生成錯誤]\n" +
      (
        error?.message ||
        String(error)
      );


    setStatus(
      "error",
      "生成失敗：" +
      (
        error?.message ||
        String(error)
      )
    );

  }finally{

    generating = false;

    updateUI();

    inputEl.focus();
  }
}


/*
============================================================
CLEAR CHAT
============================================================
*/

function clearChat(){

  if(
    !model ||
    generating
  ){
    return;
  }


  try{

    if(
      typeof model.reset ===
      "function"
    ){

      model.reset();
    }

  }catch(error){

    console.warn(
      "reset:",
      error
    );
  }


  messagesEl.innerHTML = `
    <div id="empty" class="empty">
      <div class="empty-title">
        Gemma 4 E2B
      </div>
      <div class="empty-text">
        對話已清除。
      </div>
    </div>
  `;


  setStatus(
    "success",
    "對話已清除"
  );
}


/*
============================================================
Textarea auto resize
============================================================
*/

function resizeInput(){

  inputEl.style.height =
    "auto";

  inputEl.style.height =
    Math.min(
      inputEl.scrollHeight,
      130
    ) + "px";

  updateUI();
}


/*
============================================================
PAGE LIFECYCLE

非常重要：

不要在 pagehide / visibilitychange
裡面重新載入頁面。

不要：

location.reload()

不要：

model = null

不要：

model.dispose()

因為 iPhone Safari 可能因為
memory pressure 自己終止 page process。
============================================================
*/

document.addEventListener(
  "visibilitychange",
  ()=>{

    updateDiagnostic(
      document.hidden
        ? "Safari: BACKGROUND"
        : "Safari: FOREGROUND"
    );


    if(
      document.hidden &&
      loading
    ){

      setStatus(
        "warning",
        "⚠️ Safari 已進入背景，停止自動重試。"
      );
    }
  }
);


window.addEventListener(
  "pagehide",
  ()=>{

    /*
    不做任何 reload。
    不 dispose model。
    */

    console.log(
      "Gemma V15 pagehide"
    );
  }
);


window.addEventListener(
  "pageshow",
  ()=>{

    updateDiagnostic(
      "Safari pageshow"
    );
  }
);


/*
============================================================
BUTTONS
============================================================
*/

loadBtn.addEventListener(
  "click",
  loadModel
);


diagBtn.addEventListener(
  "click",
  runDiagnostics
);


clearBtn.addEventListener(
  "click",
  clearChat
);


sendBtn.addEventListener(
  "click",
  sendMessage
);


inputEl.addEventListener(
  "input",
  resizeInput
);


inputEl.addEventListener(
  "keydown",
  event=>{

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();
    }
  }
);


/*
============================================================
INITIAL
============================================================
*/

if(!navigator.gpu){

  setStatus(
    "error",
    "✗ 此 Safari 沒有 WebGPU"
  );

  loadBtn.disabled =
    true;

}else{

  setStatus(
    "",
    "✓ WebGPU 可用，等待載入 Gemma 4"
  );
}


updateDiagnostic();

updateUI();

</script>
